<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberated AI Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-color: #0a0e27;
            --chat-bg: #ffffff08;
            --text-color: #f1f5f9;
            --accent-color: #3b82f6;
            --input-bg: #ffffff05;
            --button-hover: #2563eb;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            background-attachment: fixed;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        #chat-container {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar {
            width: 8px;
        }

        #chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        #chat-container::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }

        #chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.8);
        }

        .message {
            max-width: 75%;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: rgba(59, 130, 246, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.6);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.15);
        }

        .ai-message {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        #input-container {
            padding: 1.5rem 2rem;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 1rem;
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 0.75rem;
            resize: none;
            height: 3rem;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        textarea::placeholder {
            color: rgba(241, 245, 249, 0.5);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }

        button {
            background: rgba(59, 130, 246, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(59, 130, 246, 0.8);
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.2);
            font-size: 1rem;
            white-space: nowrap;
        }

        button:hover {
            background: rgba(37, 99, 235, 0.8);
            border-color: rgba(37, 99, 235, 1);
            box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }

            header {
                padding: 1rem 1.5rem;
                font-size: 1.25rem;
            }

            #chat-container {
                padding: 1rem;
            }

            #input-container {
                flex-direction: column;
                padding: 1rem;
            }

            button {
                padding: 0.75rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>🚀 Liberated AI Chat</header>

    <div id="chat-container">
        <!-- Messages will appear here -->
    </div>

    <div id="input-container">
        <textarea id="user-input" placeholder="Type your prompt here..." spellcheck="true"></textarea>
        <button id="send-btn">Send</button>
    </div>

    <script>
        // Chat functionality
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');

        // Handle send button click
        sendBtn.addEventListener('click', sendMessage);

        // Handle Enter key
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const message = userInput.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = '3rem';

            // Simulate AI response
            setTimeout(() => {
                addMessage('This is a demo response. Connect to an AI API for real responses.', 'ai');
            }, 500);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Auto-expand textarea
        userInput.addEventListener('input', () => {
            userInput.style.height = '3rem';
            const scrollHeight = userInput.scrollHeight;
            if (scrollHeight > 3 * 16) {
                userInput.style.height = scrollHeight + 'px';
            }
        });
    </script>

</body>
</html>
