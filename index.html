<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Liquid Gemini AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --glass:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.12);
    --text:#ffffff;
    --sub:#cbd5e1;
}

body{
    font-family:'Inter',sans-serif;
    overflow:hidden;
    height:100vh;
    color:white;
    background:#060816;
    position:relative;
}

/* REAL LIQUID BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    animation:float 16s infinite ease-in-out;
    opacity:0.7;
}

.blob1{
    width:500px;
    height:500px;
    background:#3b82f6;
    top:-120px;
    left:-100px;
}

.blob2{
    width:450px;
    height:450px;
    background:#7c3aed;
    bottom:-100px;
    right:-100px;
    animation-delay:2s;
}

.blob3{
    width:350px;
    height:350px;
    background:#06b6d4;
    top:40%;
    left:45%;
    animation-delay:4s;
}

@keyframes float{

    0%{
        transform:translate(0,0) scale(1);
    }

    25%{
        transform:translate(40px,-30px) scale(1.08);
    }

    50%{
        transform:translate(-20px,30px) scale(0.96);
    }

    75%{
        transform:translate(30px,20px) scale(1.05);
    }

    100%{
        transform:translate(0,0) scale(1);
    }
}

/* WATER WAVES */

.wave{
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle at center,
    rgba(255,255,255,0.06),
    transparent 60%);
    animation:waveMove 20s linear infinite;
}

.wave2{
    animation-duration:30s;
    opacity:0.5;
}

@keyframes waveMove{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* APP */

.app{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    height:100vh;
    width:100%;
}

/* HEADER */

header{

    margin:16px;
    padding:20px 26px;

    border-radius:32px;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.16),
        rgba(255,255,255,0.04)
    );

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.3),
    0 20px 60px rgba(0,0,0,0.35);

}

.logo{
    font-size:1.4rem;
    font-weight:800;
}

.sub{
    color:var(--sub);
    margin-top:4px;
    font-size:0.92rem;
}

/* CHAT */

#chat{

    flex:1;

    overflow-y:auto;

    padding:0 16px 16px;

    display:flex;
    flex-direction:column;
    gap:18px;

}

/* MESSAGE */

.message{

    max-width:80%;

    padding:18px 22px;

    border-radius:30px;

    position:relative;

    line-height:1.8;

    animation:show 0.35s ease;

    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);

    border:1px solid rgba(255,255,255,0.12);

    overflow:hidden;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.25),
    0 15px 40px rgba(0,0,0,0.3);

}

.message::before{

    content:"";

    position:absolute;

    inset:0;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.18),
        transparent 50%
    );

    pointer-events:none;
}

.user{

    align-self:flex-end;

    background:linear-gradient(
        180deg,
        rgba(59,130,246,0.28),
        rgba(59,130,246,0.12)
    );

}

.ai{

    align-self:flex-start;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.05)
    );

}

@keyframes show{

    from{
        opacity:0;
        transform:translateY(15px) scale(0.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* INPUT AREA */

.bottom{

    padding:16px;
}

.inputBox{

    display:flex;
    align-items:flex-end;
    gap:16px;

    padding:18px;

    border-radius:34px;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.2),
    0 20px 50px rgba(0,0,0,0.35);

}

textarea{

    flex:1;

    background:transparent;

    border:none;
    outline:none;

    color:white;

    resize:none;

    min-height:30px;
    max-height:200px;

    font-size:1rem;

    font-family:inherit;

    line-height:1.7;
}

textarea::placeholder{
    color:#cbd5e1;
}

/* LIQUID BUTTON */

button{

    width:64px;
    height:64px;

    border-radius:50%;

    border:none;

    cursor:pointer;

    color:white;

    font-size:1.4rem;
    font-weight:800;

    background:linear-gradient(
        180deg,
        #9ec5ff,
        #3b82f6
    );

    position:relative;

    overflow:hidden;

    box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.4),
    0 15px 40px rgba(59,130,246,0.5);

    transition:0.35s;
}

button::before{

    content:"";

    position:absolute;

    width:180%;
    height:180%;

    background:
    radial-gradient(circle,
    rgba(255,255,255,0.55),
    transparent 55%);

    top:-40%;
    left:-40%;

    animation:liquid 5s infinite linear;
}

@keyframes liquid{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

button:hover{

    transform:translateY(-4px) scale(1.04);

    box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.4),
    0 20px 50px rgba(59,130,246,0.65);
}

button:active{
    transform:scale(0.94);
}

/* SCROLL */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.14);
    border-radius:20px;
}

/* RESPONSIVE */

@media(max-width:768px){

    .message{
        max-width:92%;
        font-size:0.96rem;
    }

    header{
        margin:10px;
        padding:18px;
    }

    .inputBox{
        padding:14px;
    }

    button{
        width:58px;
        height:58px;
    }
}

</style>
</head>

<body>

<div class="bg">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="wave"></div>
    <div class="wave wave2"></div>

</div>

<div class="app">

<header>

    <div class="logo"> Liquid Gemini AI</div>

    <div class="sub">
        Hyper Realistic Liquid Glass Interface
    </div>

</header>

<div id="chat"></div>

<div class="bottom">

    <div class="inputBox">

        <textarea
            id="input"
            placeholder="कुछ भी पूछें..."
        ></textarea>

        <button id="send">
            ↑
        </button>

    </div>

</div>

</div>

<script>

const input = document.getElementById('input');
const send = document.getElementById('send');
const chat = document.getElementById('chat');

/* =========================
   GEMINI API SETTINGS
========================= */

/*

👇👇👇👇👇👇👇👇👇👇👇👇👇👇

यहाँ अपनी Google AI Studio API KEY डालें

*/

const API_KEY = "यहाँ API KEY डालें";

/*

👇 Gemini Model

*/

const MODEL = "gemini-1.5-flash";

/* SEND ONLY BUTTON CLICK */

send.addEventListener('click', sendMessage);

/* ENTER = NEW LINE */

input.addEventListener('keydown',(e)=>{

    if(e.key === 'Enter'){

        /*
            अब Enter दबाने पर
            message send नहीं होगा
            सिर्फ नई लाइन बनेगी
        */

        return;
    }
});

/* AUTO HEIGHT */

input.addEventListener('input',()=>{

    input.style.height = '30px';

    input.style.height =
    input.scrollHeight + 'px';
});

/* SEND MESSAGE */

async function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    addMessage(text,'user');

    input.value='';

    input.style.height='30px';

    const loading = addMessage(
        '✨ सोच रहा हूँ...',
        'ai'
    );

    try{

        const response = await fetch(

            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,

            {
                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({

                    contents:[

                        {
                            parts:[
                                {
                                    text:text
                                }
                            ]
                        }

                    ]

                })

            }

        );

        const data = await response.json();

        loading.remove();

        const reply =
        data?.candidates?.[0]?.content?.parts?.[0]?.text
        || 'कोई response नहीं मिला';

        addMessage(reply,'ai');

    }

    catch(error){

        loading.remove();

        addMessage(
            '❌ Error: API check करें',
            'ai'
        );

        console.log(error);
    }
}

/* ADD MESSAGE */

function addMessage(text,type){

    const div = document.createElement('div');

    div.className =
    `message ${type}`;

    div.textContent = text;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;

    return div;
}

</script>

</body>
</html>
