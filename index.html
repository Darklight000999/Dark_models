<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg1:#0b1020;
    --bg2:#121b35;
    --glass:rgba(255,255,255,0.08);
    --glass-border:rgba(255,255,255,0.15);
    --text:#f5f7ff;
    --sub:#aeb8d0;
    --accent:#7aa2ff;
}

body{
    font-family:'Inter',sans-serif;
    height:100vh;
    overflow:hidden;
    color:var(--text);
    background:
        radial-gradient(circle at top left,#2b4cff55,transparent 30%),
        radial-gradient(circle at bottom right,#7c4dff33,transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    flex-direction:column;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    backdrop-filter:blur(120px);
    pointer-events:none;
}

header{
    margin:20px;
    padding:20px 28px;
    border-radius:28px;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.16),
        rgba(255,255,255,0.06)
    );
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.25),
        0 10px 40px rgba(0,0,0,0.35);

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:0.5px;
}

.tag{
    color:var(--sub);
    font-size:0.9rem;
}

#chat-container{
    flex:1;
    overflow-y:auto;
    padding:10px 22px 22px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.message{
    max-width:75%;
    padding:18px 22px;
    border-radius:28px;
    position:relative;
    line-height:1.7;
    animation:fade .35s ease;

    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);

    border:1px solid rgba(255,255,255,0.12);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.18),
        0 12px 35px rgba(0,0,0,0.25);
}

.message::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.12),
        transparent 40%
    );
    pointer-events:none;
}

.user-message{
    align-self:flex-end;
    background:linear-gradient(
        180deg,
        rgba(88,130,255,0.35),
        rgba(88,130,255,0.18)
    );
}

.ai-message{
    align-self:flex-start;
    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.05)
    );
}

#input-area{
    padding:20px;
}

.input-wrap{
    display:flex;
    align-items:flex-end;
    gap:16px;

    padding:18px;
    border-radius:32px;

    background:linear-gradient(
        180deg,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0.06)
    );

    border:1px solid rgba(255,255,255,0.15);

    backdrop-filter:blur(30px) saturate(180%);

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.22),
        0 12px 40px rgba(0,0,0,0.3);
}

textarea{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    background:transparent;
    color:white;
    font-size:1rem;
    min-height:28px;
    max-height:180px;
    font-family:inherit;
}

textarea::placeholder{
    color:#b8c3de;
}

button{
    border:none;
    outline:none;
    cursor:pointer;

    width:58px;
    height:58px;

    border-radius:50%;

    color:white;
    font-size:1.2rem;
    font-weight:700;

    background:linear-gradient(
        180deg,
        #8db1ff,
        #4b7cff
    );

    box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.3),
        0 10px 30px rgba(61,112,255,0.45);

    transition:0.3s ease;
}

button:hover{
    transform:translateY(-3px) scale(1.03);
    box-shadow:
        inset 0 2px 4px rgba(255,255,255,0.4),
        0 15px 35px rgba(61,112,255,0.55);
}

button:active{
    transform:scale(0.96);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(14px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.15);
    border-radius:20px;
}

@media(max-width:768px){

    header{
        margin:12px;
        padding:18px;
        border-radius:24px;
    }

    .message{
        max-width:92%;
    }

    #chat-container{
        padding:10px 12px 12px;
    }

    #input-area{
        padding:12px;
    }

}
</style>
</head>
<body>

<header>
    <div>
        <div class="logo"> Liquid AI</div>
        <div class="tag">Apple Inspired Liquid Glass UI</div>
    </div>
</header>

<div id="chat-container"></div>

<div id="input-area">
    <div class="input-wrap">
        <textarea
            id="user-input"
            placeholder="Ask anything..."
        ></textarea>

        <button id="send-btn">↑</button>
    </div>
</div>

<script>
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const chat = document.getElementById('chat-container');

sendBtn.addEventListener('click', sendMessage);

input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});

function sendMessage(){

    const text = input.value.trim();

    if(!text) return;

    addMessage(text,'user');

    input.value='';
    input.style.height='28px';

    setTimeout(()=>{
        addMessage(
            '✨ Apple Liquid Glass UI working perfectly. Connect your AI API here.',
            'ai'
        );
    },500);
}

function addMessage(text,type){

    const div=document.createElement('div');

    div.className=`message ${type}-message`;

    div.textContent=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;
}

input.addEventListener('input',()=>{
    input.style.height='28px';
    input.style.height=input.scrollHeight+'px';
});
</script>

</body>
</html>
