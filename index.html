<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Liquid Gemini AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    width:100%;
    height:100dvh;
    min-height:100dvh;

    overflow:hidden;

    background:#040816;

    font-family:'Inter',sans-serif;

    color:white;

    position:relative;

    -webkit-tap-highlight-color:transparent;
}

/* =========================
   LIQUID BACKGROUND
========================= */

.bg{

    position:fixed;
    inset:0;

    overflow:hidden;

    z-index:1;
}

.blob{

    position:absolute;

    border-radius:50%;

    filter:blur(90px);

    opacity:0.75;

    animation:blobMove 18s infinite ease-in-out;

    will-change:transform;
}

.blob1{

    width:min(45vw,500px);
    height:min(45vw,500px);

    background:#2563eb;

    top:-10%;
    left:-10%;
}

.blob2{

    width:min(40vw,450px);
    height:min(40vw,450px);

    background:#7c3aed;

    bottom:-10%;
    right:-10%;

    animation-delay:2s;
}

.blob3{

    width:min(30vw,350px);
    height:min(30vw,350px);

    background:#06b6d4;

    top:40%;
    left:40%;

    animation-delay:4s;
}

@keyframes blobMove{

    0%{
        transform:translate(0,0) scale(1);
    }

    25%{
        transform:translate(60px,-30px) scale(1.08);
    }

    50%{
        transform:translate(-30px,50px) scale(0.94);
    }

    75%{
        transform:translate(30px,20px) scale(1.05);
    }

    100%{
        transform:translate(0,0) scale(1);
    }
}

/* =========================
   WATER WAVES
========================= */

.wave{

    position:absolute;

    width:220%;
    height:220%;

    top:-60%;
    left:-60%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,0.05),
        transparent 65%
    );

    animation:rotateWave 22s linear infinite;
}

.wave2{

    animation-duration:35s;

    opacity:0.45;
}

@keyframes rotateWave{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* =========================
   LIQUID CLICK EFFECT
========================= */

.ripple{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.08),
        transparent 70%
    );

    animation:rippleAnim 1s ease-out forwards;

    z-index:9999;

    backdrop-filter:blur(10px);
}

@keyframes rippleAnim{

    from{

        width:0;
        height:0;

        opacity:1;
    }

    to{

        width:300px;
        height:300px;

        opacity:0;
    }
}

/* =========================
   APP
========================= */

.app{

    position:relative;

    z-index:5;

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;

    overflow:hidden;
}

/* =========================
   HEADER
========================= */

header{

    width:calc(100% - 20px);

    max-width:1600px;

    margin:10px auto;

    padding:20px 24px;

    border-radius:32px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.15),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(35px) saturate(180%);
    -webkit-backdrop-filter:blur(35px) saturate(180%);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.25),
    0 15px 45px rgba(0,0,0,0.35);

    flex-shrink:0;
}

.logo{

    font-size:1.4rem;

    font-weight:800;
}

.sub{

    margin-top:4px;

    color:#cbd5e1;

    font-size:0.92rem;
}

/* =========================
   CHAT
========================= */

#chat{

    flex:1;

    overflow-y:auto;
    overflow-x:hidden;

    padding:16px;

    display:flex;
    flex-direction:column;

    gap:18px;

    scroll-behavior:smooth;
}

/* =========================
   MESSAGE
========================= */

.message{

    position:relative;

    width:fit-content;

    max-width:min(90%,850px);

    padding:18px 22px;

    border-radius:30px;

    line-height:1.8;

    word-break:break-word;

    animation:messageAnim 0.35s ease;

    backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);

    border:1px solid rgba(255,255,255,0.12);

    overflow:hidden;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.18),
    0 15px 40px rgba(0,0,0,0.3);
}

.message::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.15),
        transparent 45%
    );

    pointer-events:none;
}

.user{

    align-self:flex-end;

    background:
    linear-gradient(
        180deg,
        rgba(59,130,246,0.25),
        rgba(59,130,246,0.08)
    );
}

.ai{

    align-self:flex-start;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.12),
        rgba(255,255,255,0.05)
    );
}

@keyframes messageAnim{

    from{
        opacity:0;
        transform:translateY(15px) scale(0.96);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================
   INPUT AREA
========================= */

.bottom{

    width:100%;

    padding:16px;

    flex-shrink:0;
}

.inputBox{

    width:100%;

    max-width:1500px;

    margin:auto;

    display:flex;
    align-items:flex-end;

    gap:14px;

    padding:16px;

    border-radius:34px;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0.05)
    );

    border:1px solid rgba(255,255,255,0.12);

    backdrop-filter:blur(35px) saturate(180%);
    -webkit-backdrop-filter:blur(35px) saturate(180%);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.2),
    0 15px 45px rgba(0,0,0,0.35);
}

/* =========================
   TEXTAREA
========================= */

textarea{

    flex:1;

    border:none;
    outline:none;

    resize:none;

    background:transparent;

    color:white;

    font-size:1rem;

    font-family:inherit;

    line-height:1.7;

    min-height:30px;
    max-height:220px;

    overflow-y:auto;
}

textarea::placeholder{
    color:#cbd5e1;
}

/* =========================
   BUTTON
========================= */

button{

    position:relative;

    width:62px;
    height:62px;

    border-radius:50%;

    border:none;

    cursor:pointer;

    overflow:hidden;

    color:white;

    font-size:1.3rem;
    font-weight:800;

    background:
    linear-gradient(
        180deg,
        #9ec5ff,
        #2563eb
    );

    box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.35),
    0 15px 40px rgba(37,99,235,0.5);

    transition:0.35s;
}

button::before{

    content:"";

    position:absolute;

    width:180%;
    height:180%;

    top:-40%;
    left:-40%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,0.45),
        transparent 60%
    );

    animation:liquidRotate 6s linear infinite;
}

@keyframes liquidRotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

button:hover{

    transform:translateY(-4px) scale(1.04);

    box-shadow:
    inset 0 2px 4px rgba(255,255,255,0.4),
    0 20px 50px rgba(37,99,235,0.65);
}

button:active{
    transform:scale(0.94);
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{

    background:
    rgba(255,255,255,0.12);

    border-radius:20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

    header{

        padding:18px;

        border-radius:26px;
    }

    .message{

        max-width:95%;

        padding:16px;

        border-radius:24px;

        font-size:0.96rem;
    }

    textarea{
        font-size:16px;
    }

    button{

        width:56px;
        height:56px;
    }

    .blob{
        filter:blur(70px);
    }
}

@media(min-width:1600px){

    #chat{
        max-width:1600px;
        width:100%;
        margin:auto;
    }
}

/* =========================
   SAFE AREA
========================= */

@supports(padding:max(0px)){

    header{

        margin-top:
        max(10px,env(safe-area-inset-top));
    }

    .bottom{

        padding-bottom:
        max(16px,env(safe-area-inset-bottom));
    }
}

</style>

</head>

<body>

<div class="bg">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <div class="wave"></div>
    <div class="wave wave2"></div>

</div>

<div class="app">

<header>

    <div class="logo"> Liquid Gemini AI</div>

    <div class="sub">
        Hyper Realistic Liquid Glass Interface
    </div>

</header>

<div id="chat"></div>

<div class="bottom">

    <div class="inputBox">

        <textarea
        id="input"
        placeholder="कुछ भी पूछें..."
        ></textarea>

        <button id="send">
            ↑
        </button>

    </div>

</div>

</div>

<script>

/* =========================
   MOBILE HEIGHT FIX
========================= */

function setRealHeight(){

    document.documentElement.style.setProperty(
        '--app-height',
        `${window.innerHeight}px`
    );
}

window.addEventListener(
    'resize',
    setRealHeight
);

setRealHeight();

/* =========================
   ELEMENTS
========================= */

const input =
document.getElementById('input');

const send =
document.getElementById('send');

const chat =
document.getElementById('chat');

/* =========================
   GEMINI API SETTINGS
========================= */

/*

👇👇👇👇👇👇👇👇👇👇👇👇👇👇

यहाँ अपनी Google AI Studio API KEY डालें

*/

const API_KEY =
"AQ.Ab8RN6KvIDiAhpBYaXtNyXzExvKHnkVGmOQt5ddaCBwHW30sgw";

/*

👇 Gemini Model

*/

const MODEL =
"gemini-1.5-flash";

/* =========================
   CLICK RIPPLE EFFECT
========================= */

document.addEventListener(
'click',
(e)=>{

    const ripple =
    document.createElement('div');

    ripple.className='ripple';

    ripple.style.left =
    e.clientX + 'px';

    ripple.style.top =
    e.clientY + 'px';

    document.body.appendChild(ripple);

    setTimeout(()=>{

        ripple.remove();

    },1000);
});

/* =========================
   ENTER = NEW LINE ONLY
========================= */

input.addEventListener(
'keydown',
(e)=>{

    /*
        Enter दबाने पर
        message send नहीं होगा
        सिर्फ नई लाइन बनेगी
    */

    if(e.key === 'Enter'){

        return;
    }
});

/* =========================
   AUTO HEIGHT
========================= */

input.addEventListener(
'input',
()=>{

    input.style.height='30px';

    input.style.height=
    input.scrollHeight + 'px';
});

/* =========================
   SEND ONLY BUTTON
========================= */

send.addEventListener(
'click',
sendMessage
);

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

    const text =
    input.value.trim();

    if(!text) return;

    addMessage(text,'user');

    input.value='';

    input.style.height='30px';

    const loading =
    addMessage(
        '✨ सोच रहा हूँ...',
        'ai'
    );

    try{

        const response =
        await fetch(

        `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${API_KEY}`,

        {

            method:'POST',

            headers:{
                'Content-Type':'application/json'
            },

            body:JSON.stringify({

                contents:[

                    {
                        parts:[
                            {
                                text:text
                            }
                        ]
                    }

                ]

            })

        });

        const data =
        await response.json();

        loading.remove();

        const reply =

        data?.candidates?.[0]
        ?.content?.parts?.[0]
        ?.text

        ||

        '❌ कोई response नहीं मिला';

        addMessage(reply,'ai');

    }

    catch(error){

        loading.remove();

        addMessage(
            '❌ API Error',
            'ai'
        );

        console.log(error);
    }
}

/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

    const div =
    document.createElement('div');

    div.className =
    `message ${type}`;

    div.textContent =
    text;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;

    return div;
}

</script>

</body>
</html>
